name: Personal Auto-Update APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-mobile-auto-update-apk
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish personal mobile APKs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUVIO_PERSONAL_UPDATE_BUILD: "true"
      NUVIO_UPDATE_GITHUB_OWNER: "mrwestside12"
      NUVIO_SIGNING_KEY_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      NUVIO_LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cmp-rewrite
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore verified services and permanent signing
        run: |
          set -euo pipefail
          if [ -z "$NUVIO_LOCAL_PROPERTIES_BASE64" ] || [ -z "$NUVIO_SIGNING_KEY_BASE64" ]; then
            echo "Mobile signing or service configuration is not configured."
            exit 1
          fi
          printf '%s' "$NUVIO_LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          key_path="$RUNNER_TEMP/nuvio-mobile-personal.jks"
          printf '%s' "$NUVIO_SIGNING_KEY_BASE64" | base64 --decode > "$key_path"
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "$key_path" >> local.properties

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            TRAKT_REDIRECT_URI
            SIMKL_CLIENT_ID
            SIMKL_REDIRECT_URI
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required mobile setting: $property_name"
              exit 1
            fi
          done

      - name: Calculate personal version
        id: version
        run: |
          set -euo pipefail
          base_version=$(./scripts/release-metadata.sh | sed -n 's/^version=//p')
          if [ -z "$base_version" ]; then
            echo "Could not determine the official mobile version."
            exit 1
          fi
          personal_version="${base_version}-personal.${GITHUB_RUN_NUMBER}"
          personal_version_code=$((1000000 + GITHUB_RUN_NUMBER))
          {
            echo "name=$personal_version"
            echo "code=$personal_version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Test continuous Shuffle and build signed APKs
        env:
          NUVIO_PERSONAL_VERSION_NAME: ${{ steps.version.outputs.name }}
          NUVIO_PERSONAL_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew \
            :composeApp:testAndroidHostTest \
            --tests 'com.nuvio.app.features.details.RandomEpisodePickerTest' \
            :androidApp:assembleFullRelease \
            --no-daemon \
            --stacktrace

      - name: Verify and name personal APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_CERT_SHA256: c7aeb1276fdab6ef77cf473ddf4c46146b0bbeaf1893636d31a259b37242eead
        run: |
          set -euo pipefail
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          output_dir="$RUNNER_TEMP/personal-apks"
          mkdir -p "$output_dir"
          found=0
          for apk in androidApp/build/outputs/apk/full/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            "$apksigner_path" verify "$apk"
            signer=$(
              "$apksigner_path" verify --print-certs "$apk" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
                tr '[:upper:]' '[:lower:]'
            )
            if [ "$signer" != "$EXPECTED_CERT_SHA256" ]; then
              echo "Unexpected APK signer."
              exit 1
            fi
            abi=$(basename "$apk" | sed -E 's/^androidApp-full-(.+)-release\.apk$/\1/')
            cp "$apk" "$output_dir/NuvioMobile-${VERSION_NAME}-SHUFFLE-CONTINUOUS-PERSONAL-SIGNED-${abi}.apk"
          done
          if [ "$found" -ne 1 ]; then
            echo "No mobile APKs were produced."
            exit 1
          fi
          echo "PERSONAL_APK_DIR=$output_dir" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NuvioMobile-${{ steps.version.outputs.name }}-personal-signed
          path: ${{ runner.temp }}/personal-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish in-app update release
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "personal-$VERSION_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target cmp-rewrite \
            --prerelease \
            --title "Nuvio Mobile $VERSION_NAME" \
            --notes "Personal Android build with continuous episode Shuffle, verified mobile services, permanent signing, and in-app updates from this fork." \
            "$PERSONAL_APK_DIR"/*.apk
